version: '3.8'

services:
  # PostgreSQL 15 + PostGIS 3.3 Database
  db:
    image: postgis/postgis:15-3.3
    container_name: landstack-postgis
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-landstack_db}
      POSTGRES_USER: ${POSTGRES_USER:-landstack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-landstack_secure_pwd}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-landstack_user} -d ${POSTGRES_DB:-landstack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python FastAPI AI Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: landstack-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Spring Boot 3.2.3 Java 17 Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: landstack-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-landstack_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-landstack_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-landstack_secure_pwd}
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started

  # React 18 + Vite Frontend (Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: landstack-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
