server:
  port: 8080

spring:
  application:
    name: landstack-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:landstack;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:super_secret_jwt_key_land_stack_dpi_2026_sih26014_secure_key}
    expiration-ms: 86400000 # 24 Hours
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
